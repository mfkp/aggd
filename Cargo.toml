[workspace]
resolver = "2"
members = ["crates/modes", "crates/aggd", "crates/aggbench"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
modes = { path = "crates/modes" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "signal", "fs"] }
parking_lot = "0.12"
ryu = "1"
itoa = "1"
flate2 = "1"
zstd = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
debug = 1
lto = "thin"
